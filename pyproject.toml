[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cxwa"
version = "0.1.0"
description = "Local-first multi-agent orchestration platform for software engineering workspaces."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "codex", "cli", "orchestration", "worktrees"]
authors = [
  { name = "CXW contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=1.0",
  "prompt_toolkit>=3.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
agents = [
  "openai-agents",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]
publish = [
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
cxw = "cxw.cli:main"

[project.urls]
Documentation = "https://github.com/MeverikC/CXW/tree/main/docs"
Issues = "https://github.com/MeverikC/CXW/issues"
Source = "https://github.com/MeverikC/CXW"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cxw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
